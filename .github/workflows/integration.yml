name: Integration Tests

on:
  schedule:
    # Run daily at 00:00 UTC (08:00 Beijing Time)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          9.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore EdgeTTS.DotNet.sln

    - name: Build solution
      run: dotnet build EdgeTTS.DotNet.sln --configuration Release --no-restore

    - name: Run integration tests
      run: dotnet test EdgeTTS.DotNet.sln --configuration Release --no-build --verbosity normal --filter "Category=Integration" --logger "trx;LogFileName=test-results.trx" --results-directory TestResults --blame-hang-timeout 5m

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-results
        path: TestResults/**/*.trx
